<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Bee</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <div id="frame" class="frame is-empty">
        <canvas id="view" width="512" height="512"></canvas>
        <canvas id="fly" class="fly" width="512" height="512"></canvas>
        <button id="drop" class="drop" type="button">Drop an image</button>
        <p id="hint" class="hint">hold to compare</p>
      </div>

      <div class="hud">
        <canvas id="sourceCanvas" width="96" height="96"></canvas>
        <canvas id="targetCanvas" width="96" height="96"></canvas>
        <select id="size" aria-label="Quality">
          <option value="256">256</option>
          <option value="384" selected>384</option>
          <option value="512">512</option>
        </select>
        <button id="download" type="button" disabled>Download</button>
      </div>
      <p id="status" class="status"></p>
    </div>
    <input id="file" type="file" accept="image/*,.svg" hidden />
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
