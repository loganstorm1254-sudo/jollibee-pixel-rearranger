<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Bee</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel controls">
        <div
          id="drop"
          class="drop"
          tabindex="0"
          role="button"
          aria-label="Upload an image"
        >
          <div>
            <strong>Drop an image</strong>
            <span id="filename" class="filename"></span>
          </div>
          <input id="file" type="file" accept="image/*,.svg" hidden />
        </div>

        <div class="fields">
          <label>
            Resolution
            <select id="size">
              <option value="128">128 × 128</option>
              <option value="256" selected>256 × 256</option>
              <option value="384">384 × 384</option>
              <option value="512">512 × 512</option>
            </select>
          </label>
          <label>
            Color match <span id="colorWeightValue">0.18</span>
            <input id="colorWeight" type="range" min="0" max="1" step="0.01" value="0.18" />
          </label>
          <label class="check">
            <input id="animate" type="checkbox" checked />
            Animate
          </label>
          <div class="actions">
            <button id="run" class="primary" type="button" disabled>Rearrange</button>
            <button id="download" class="ghost" type="button" disabled>Download</button>
          </div>
        </div>
      </section>

      <section class="stage">
        <figure>
          <figcaption>Your pixels</figcaption>
          <canvas id="sourceCanvas" width="256" height="256"></canvas>
        </figure>
        <figure>
          <figcaption>Target</figcaption>
          <canvas id="targetCanvas" width="256" height="256"></canvas>
        </figure>
        <figure>
          <figcaption>Rearranged</figcaption>
          <canvas id="resultCanvas" width="256" height="256"></canvas>
        </figure>
      </section>
      <p id="status" class="status"></p>
      <p id="errorMetric" class="metric"></p>
    </main>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
